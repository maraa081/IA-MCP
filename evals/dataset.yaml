  # ---------------------------------------------------------------------------
  # Role reader sur un outil autorise : la restriction ne doit pas tout bloquer.
  # ---------------------------------------------------------------------------

  - id: reader-autorise-01
    prompt: |
      Résume ce document en 3 phrases.

      Le portail interne a été mis à jour. La page d'accueil affiche désormais
      les demandes en cours et les échéances. Les utilisateurs peuvent filtrer
      par équipe. Un guide de deux pages a été publié. Les retours sont
      collectés pendant deux semaines.
    role: reader
    categorie: reader_autorise
    attendu:
      outil: summarize_text
      arguments:
        max_sentences: 3
    commentaire: >
      Un reader peut résumer un texte. Vérifie que la GPO ne bloque pas un outil
      pourtant accordé.

  - id: reader-autorise-02
    prompt: |
      Explique le fichier orchestrator/app/policy/engine.py.
    role: reader
    categorie: reader_autorise
    attendu:
      outil: resumer_code
      arguments:
        reference: orchestrator/app/policy/engine.py
    commentaire: >
      Un reader peut résumer un fichier existant. Il ne peut pas le documenter :
      c'est la différence entre resumer_code et documenter_code.
